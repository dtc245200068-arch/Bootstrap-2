<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bố cục 3 cột Bootstrap</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TIÊU ĐỀ -->
    <div class="container my-5 py-3">
        <h1 class="text-center">
            <i class="fas fa-home"></i>
            Trang chủ
        </h1>

        <p class="text-center text-muted">
            Thực hành Bootstrap Grid và Flexbox
        </p>
    </div>


    <!-- BỐ CỤC 3 CỘT -->
    <div class="container mt-5">

        <div class="row">

            <div class="col-md-4 d-flex justify-content-center
                        align-items-center bg-light p-3">
                <p class="mb-0">Phần 1</p>
            </div>

            <div class="col-md-4 d-flex justify-content-center
                        align-items-center bg-secondary p-3 text-white">
                <p class="mb-0">Phần 2</p>
            </div>

            <div class="col-md-4 d-flex justify-content-center
                        align-items-center bg-light p-3">
                <p class="mb-0">Phần 3</p>
            </div>

        </div>

    </div>


    <!-- MARGIN & PADDING -->
    <div class="container my-5 py-3 bg-light">

        <h3 class="text-center">
            Khoảng cách được điều chỉnh bằng Margin & Padding
        </h3>

    </div>


    <!-- DISPLAY PROPERTY -->
    <div class="d-none d-md-block bg-warning text-center p-3">

        <p class="mb-0">
            Nội dung này chỉ hiển thị trên màn hình lớn hơn hoặc bằng 768px
        </p>

    </div>


    <!-- CAROUSEL -->
    <div class="container">

        <div id="myCarousel"
             class="carousel slide mt-5"
             data-bs-ride="carousel">

            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img src="Anh/image1.jpg"
                         class="d-block w-100"
                         alt="Hình ảnh 1">
                </div>

                <div class="carousel-item">
                    <img src="Anh/image2.jpg"
                         class="d-block w-100"
                         alt="Hình ảnh 2">
                </div>

                <div class="carousel-item">
                    <img src="Anh/image3.jpg"
                         class="d-block w-100"
                         alt="Hình ảnh 3">
                </div>

            </div>

            <button class="carousel-control-prev"
                    type="button"
                    data-bs-target="#myCarousel"
                    data-bs-slide="prev">

                <span class="carousel-control-prev-icon"></span>

            </button>

            <button class="carousel-control-next"
                    type="button"
                    data-bs-target="#myCarousel"
                    data-bs-slide="next">

                <span class="carousel-control-next-icon"></span>

            </button>

        </div>

    </div>


    <!-- FORM -->
    <form class="container mt-5 mb-5">

        <h3 class="text-center mb-4">
            <i class="fas fa-envelope"></i>
            Liên hệ
        </h3>

        <div class="mb-3">

            <label for="name" class="form-label">
                Họ và tên
            </label>

            <input type="text"
                   class="form-control"
                   id="name"
                   placeholder="Nhập họ và tên">

        </div>

        <div class="mb-3">

            <label for="email" class="form-label">
                Email
            </label>

            <input type="email"
                   class="form-control"
                   id="email"
                   placeholder="Nhập email">

        </div>

        <div class="mb-3">

            <label for="message" class="form-label">
                Nội dung
            </label>

            <textarea class="form-control"
                      id="message"
                      rows="4"
                      placeholder="Nhập nội dung"></textarea>

        </div>

        <button type="submit" class="btn btn-primary">

            <i class="fas fa-paper-plane"></i>
            Gửi

        </button>

    </form>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
